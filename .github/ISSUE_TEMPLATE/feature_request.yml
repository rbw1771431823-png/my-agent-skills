name: 改进建议 / Feature request
description: 说明使用场景与希望改善的结果。
title: "[Idea] "
body:
  - type: textarea
    id: context
    attributes:
      label: 使用场景与困难 / Situation and problem
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: 希望得到的行为 / Desired behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法或例子 / Alternatives or examples
      description: 可选；不要包含私人资料。
